name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: apple/App
        run: |
          xcodegen
          xcodebuild -scheme Calcusome -configuration Release -destination 'platform=macOS' -derivedDataPath DerivedData build
          codesign --verify --verbose DerivedData/Build/Products/Release/Calcusome.app
          mkdir dmg && cp -R DerivedData/Build/Products/Release/Calcusome.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Calcusome -srcfolder dmg -format UDZO "$GITHUB_WORKSPACE/Calcusome-macOS.dmg"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Calcusome-macOS.dmg --title "$GITHUB_REF_NAME" --generate-notes
