name: Calcusome
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
packages:
  CalcCore:
    path: ../CalcCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.4"
targets:
  Calcusome:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [Sources, Resources]
    dependencies:
      - package: CalcCore
      - package: Supabase
        product: Supabase
    configFiles:  # Base.xcconfig pulls in the optional, git-ignored Signing.local.xcconfig
      Debug: Base.xcconfig
      Release: Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calcusome.app  # placeholder, replace before TestFlight
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Calcusome
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": $(MAC_SIGN_IDENTITY)  # set in Base.xcconfig
